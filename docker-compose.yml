# rest-api-mvc-php — local development / staging compose.
#
# Redo of the C1 Docker deliverable per DEC-R1-001 review findings (see
# Dockerfile header for the B1/B2 fixes). W1 fix: no `version:` field
# (Compose V2 ignores it; kept out for forward compatibility).
#
# [R92] All bind mounts live under ./var — named volumes are forbidden.
# [R60/R64/R102] Resource limits (cpu/memory/pids) declared on every
#   service using the classic top-level fields, not `deploy.resources`
#   (which only applies under Swarm unless `--compatibility` is passed) —
#   this way the limits are enforced by a plain `docker compose up`.
#
# Known partial-compliance note (R91): `nginx`, `mysql`, and `redis` use
# official upstream images directly rather than each being wrapped in its
# own local Dockerfile. Only `api` — the service with actual custom
# behavior (extensions, app code, healthcheck) — builds from a local
# Dockerfile. This matches the shape already R1-reviewed/approved for this
# repo; flagging it rather than claiming full literal R91 compliance.

services:
  nginx:
    image: nginx:1.31-alpine
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./var/nginx/logs:/var/log/nginx
      - ./api:/var/www/html/api:ro
      - ./health.php:/var/www/html/health.php:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost/health.php"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 100
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-rest_api}
      DB_PASS: ${DB_PASS:?set DB_PASS in .env}
      DB_NAME: ${DB_NAME:-rest_api}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
      URL_ROOT: ${URL_ROOT:-http://localhost:8080/api}
      SITE_NAME: rest-api-mvc-php
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/health.php SCRIPT_FILENAME=/var/www/html/health.php REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 100
    security_opt:
      - no-new-privileges:true

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:-rest_api}
      MYSQL_USER: ${DB_USER:-rest_api}
      MYSQL_PASSWORD: ${DB_PASS:?set DB_PASS in .env}
    volumes:
      - ./var/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 200
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "60", "1"]
    volumes:
      - ./var/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 50
    security_opt:
      - no-new-privileges:true
