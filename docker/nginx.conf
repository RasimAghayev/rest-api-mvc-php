# rest-api-mvc-php — nginx front, proxies to the `api` php-fpm service.
#
# N2 fix (DEC-R1-001): the old config had `location /api` duplicating the
# root location's try_files logic (same fallback, two places to keep in
# sync). This version has exactly one rewrite rule for the app entry point
# and one dedicated location for the health check — no overlap.
#
# The rewrite below is a direct nginx translation of api/.htaccess's Apache
# rule (`RewriteCond !-f/!-d` + `RewriteRule ^(.+)$ index.php?url=$1`):
# same "only rewrite if the file doesn't already exist" condition, same
# `url=$1` param WITHOUT a leading slash — app/libraries/Core.php's
# getUrl() does explode('/', $_GET['url']) and expects index 0 to be the
# controller name, so a leading slash (producing an empty index 0) would
# silently break every route.

server {
    listen 80;
    server_name _;
    root /var/www/html/api;
    index index.php;

    client_max_body_size 10m;

    location = /health.php {
        fastcgi_pass api:9000;
        fastcgi_index health.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/health.php;
    }

    location / {
        if (!-e $request_filename) {
            rewrite ^/(.*)$ /index.php?url=$1 last;
        }
    }

    location = /index.php {
        fastcgi_pass api:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param QUERY_STRING $query_string;
    }

    # No other .php files are directly reachable.
    location ~ \.php$ {
        return 404;
    }
}
